name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_real_api_smoke:
        description: Run the real API builtin smoke suite
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

# 同一分支只保留最新提交，避免 develop 连续 push 浪费 runner 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Verify architecture boundaries
        shell: bash
        run: |
          if git grep -n -E 'agent/core/tool|agent/gateway/tool|workplan/runtime/graph|workplan/runtime/serialize|workplan/dsl' -- '*.go'; then
            echo 'legacy Go package reference detected'
            exit 1
          fi

          if go list -deps ./tools/... | grep -Eq '^github.com/RedHuang-0622/Seele/(agent|workplan|seelectx|accountpool)(/|$)'; then
            echo 'tools has a forbidden reverse dependency'
            exit 1
          fi

          if go list -deps ./workplan/... | grep -Eq '^github.com/RedHuang-0622/Seele/(agent|seelectx)(/|$)'; then
            echo 'workplan has a forbidden product/runtime dependency'
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build all packages and examples
        run: go build ./...

  test:
    name: Test / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - shard: agent-api
            packages: ./accountpool/... ./agent/... ./config/... ./types/...
            test_timeout: 5m
          - shard: engine
            packages: ./engine/...
            test_timeout: 8m
          - shard: context
            packages: ./seelectx/...
            test_timeout: 5m
          - shard: tools-telemetry
            packages: ./tools/... ./telemetry/...
            test_timeout: 5m
          - shard: workplan
            packages: ./workplan/...
            test_timeout: 5m
          - shard: integration
            packages: ./test/... ./cmd/smoke
            test_timeout: 6m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Race, test, and collect coverage
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          profile="${RUNNER_TEMP}/coverage-${{ matrix.shard }}.out"
          go test \
            -race \
            -covermode=atomic \
            -coverprofile="${profile}" \
            -count=1 \
            -timeout '${{ matrix.test_timeout }}' \
            ${{ matrix.packages }}
          go tool cover -func="${profile}" | tail -n 1

  ci-success:
    name: CI Passed
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          [[ '${{ needs.quality.result }}' == 'success' ]]
          [[ '${{ needs.test.result }}' == 'success' ]]

  real-api-smoke:
    name: Real API Smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_api_smoke }}
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run real builtin Function Calling smoke
        env:
          RUN_REAL_API_SMOKE: 'true'
          SEELE_SMOKE_BASE_URL: ${{ secrets.SEELE_SMOKE_BASE_URL }}
          SEELE_SMOKE_API_KEY: ${{ secrets.SEELE_SMOKE_API_KEY }}
          SEELE_SMOKE_MODEL: ${{ secrets.SEELE_SMOKE_MODEL }}
          SEELE_SMOKE_PROVIDER: ${{ secrets.SEELE_SMOKE_PROVIDER }}
        run: go test ./cmd/smoke -run TestRealAPIBuiltinSmoke -v -count=1 -timeout 8m
